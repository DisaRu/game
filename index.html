<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jump Tower</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div>Уровень: <span id="level">1</span> — <span id="level-name"></span></div>
    <div>Время: <span id="time">0.00</span></div>
    <div>Смертей: <span id="deaths">0</span></div>
  </div>

  <div id="result" class="hidden">
    <h2>Уровень пройден!</h2>
    <div class="result-row">Время: <span id="result-time">0.00</span> сек</div>
    <div class="result-row">Смертей: <span id="result-deaths">0</span></div>
    <div class="result-row">Игроков прошло: <span id="result-players">—</span></div>
    <div class="result-buttons">
      <button id="btn-retry">Заново</button>
      <button id="btn-next">Следующий</button>
    </div>
  </div>

  <div id="touch-controls">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
    <div class="touch-btn" id="btn-jump">▲</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
