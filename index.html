<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚔️ Бесконечный захват</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    background: #0a0a0a; color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    user-select: none; touch-action: none;
  }
  #game { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  /* Нижняя панель — заполняет всю ширину, без пустот */
  .bottom-panel {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: #141416;
    border-top: 1px solid #2a2a2c;
  }
  .stats { display: flex; gap: 12px; font-size: 13px; white-space: nowrap; }
  .stats b { color: #4da3ff; }

  .mode-switch { display: flex; gap: 4px; }
  .mode-btn {
    padding: 6px 10px; border-radius: 6px;
    border: 1px solid #333; background: #1c1c1e;
    color: #fff; font-size: 12px; cursor: pointer;
  }
  .mode-btn.active { background: #4da3ff; border-color: #4da3ff; }

  .bars { display: flex; flex-direction: column; gap: 4px; }
  .energy-bar {
    height: 22px; background: rgba(28,28,30,0.9);
    border-radius: 11px; overflow: hidden;
    position: relative; border: 1px solid #2a2a2c;
  }
  .energy-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4da3ff, #a855f7);
    transition: width 0.05s linear;
  }
  .energy-fill.hp {
    background: linear-gradient(90deg, #34c759, #7ddf7d);
  }
  .energy-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }

  .actions { display: flex; gap: 8px; }
  .act-btn {
    width: 58px; height: 58px; border-radius: 50%;
    border: none; color: #fff; font-size: 11px; font-weight: bold;
    cursor: pointer; touch-action: none;
    transition: transform 0.08s, background 0.15s;
  }
  .act-btn.grow { background: #007aff; }
  .act-btn.grow.holding { transform: scale(0.93); background: #a855f7; }
  .act-btn.heal { background: #34c759; }
  .act-btn.heal.holding { transform: scale(0.93); background: #1ea848; }

  /* Рейтинг игроков — полупрозрачный, не мешает кликам */
  .rating {
    position: absolute; top: 12px; left: 12px;
    background: rgba(20,20,22,0.45);
    padding: 8px 10px; border-radius: 10px;
    font-size: 12px; line-height: 1.5;
    pointer-events: none; opacity: 0.6;
    min-width: 120px;
  }
  .rating .r-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .rating .r-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .rating .r-name { flex: 1; }
  .rating .r-cells { color: #4da3ff; font-weight: bold; }

  .toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px; border-radius: 10px;
    font-weight: bold; font-size: 15px;
    pointer-events: none; z-index: 50;
    animation: toastAnim 1.6s ease-out forwards;
  }

  .start-screen {
    position: absolute; top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(20,20,22,0.95);
    padding: 14px 18px; border-radius: 12px;
    border: 1px solid #2a2a2c; text-align: center;
    z-index: 100; pointer-events: none;
  }
  .start-screen h1 { margin: 0 0 6px; font-size: 18px; }
  .start-screen p { opacity: 0.7; font-size: 13px; margin: 6px 0; }
  .start-btn {
    pointer-events: auto;
    padding: 10px 24px; font-size: 15px; font-weight: bold;
    background: #444; color: #fff; border: none;
    border-radius: 10px; cursor: not-allowed;
  }
  .start-btn.ready { background: #007aff; cursor: pointer; }
  @keyframes toastAnim {
    0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
    20% { opacity: 1; transform: translateX(-50%) translateY(0); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  }
</style>
</head>
<body>

<div id="game">
  <canvas id="canvas"></canvas>
  <div class="rating" id="rating"></div>
  <div class="start-screen" id="startScreen">
    <h1>🏰 Основай базу</h1>
    <p>Кликни по карте, чтобы выбрать место главной башни 3×3.</p>
    <button class="start-btn" id="startBtn" disabled>Начать</button>
  </div>
</div>

<div class="bottom-panel">
  <div class="stats">
    <span>🧱 <b id="hudCells">1</b></span>
  </div>
  <div class="mode-switch">
    <button class="mode-btn" data-mode="border">Граница</button>
    <button class="mode-btn active" data-mode="focus">Вырезать</button>
    <button class="mode-btn" data-mode="deep">Вглубь</button>
  </div>
  <div class="bars">
    <div class="energy-bar">
      <div class="energy-fill hp" id="hpFill"></div>
      <div class="energy-text" id="hpText">0 / 100</div>
    </div>
    <div class="energy-bar">
      <div class="energy-fill" id="energyFill"></div>
      <div class="energy-text" id="energyText">0 / 5</div>
    </div>
  </div>
  <div class="actions">
    <button class="act-btn heal" id="healBtn">ЛЕЧИТЬ</button>
    <button class="act-btn grow" id="btn">РОСТ</button>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
